name: Fix language app
on:
  push:
    paths:
      - 'lesson-generator.js'
      - '.github/workflows/fix-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject lesson generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="lesson-generator.js"></script>'
          if tag not in s:
              marker='<script src="data.js"></script>'
              if marker not in s:
                  raise SystemExit('data.js script tag not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load generated lessons in web app'
          git push
